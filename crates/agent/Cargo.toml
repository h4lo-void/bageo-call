[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bageo agent: answers the phone's calls with a Gemini Live voice, web console, notifications"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
flate2.workspace = true
# Contacts import: CSV files saved in Big5, GBK, Shift_JIS … (Excel's local encodings).
encoding_rs = "0.8"
# Share UDP 5353 with the system's mDNS responder (SO_REUSEADDR / SO_REUSEPORT).
socket2 = { version = "0.6", features = ["all"] }
