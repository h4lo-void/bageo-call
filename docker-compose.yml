# Optional: run the agent in Docker (see the comments in Dockerfile).
#
#   cp .env.example .env      # set CALLS_UI_TOKEN and DEVICE_TOKEN
#   docker compose up -d --build
#
# The web console is then at http://<this-host>:8787/?token=<CALLS_UI_TOKEN>
# and phones connect to ws://<this-host>:8787/ws?token=<DEVICE_TOKEN>.
#
# http://bageo.local:8787 (the agent's network name, MDNS_NAME): the agent does
# not answer it inside a container (with the default bridge network below the
# answers would stay inside Docker). To use the name, let the host announce
# it, e.g. with avahi:
#   avahi-publish -a -R bageo.local <this host's IP>
# Links in notifications use PUBLIC_URL; inside a container nothing is filled
# in automatically, so set it (e.g. http://192.168.1.20:8787 or
# http://bageo.local:8787) in .env.
#
# Upgrading from before the rename to Bageo: Docker names the data volume after
# the folder (myna-call_calls_data for a folder called myna-call). Keep the
# folder, or use the old name as the project name (docker compose -p myna-call
# up -d --build), and the call records stay. A container still called
# myna-call holds port 8787: remove it first (docker rm -f myna-call).
services:
  agent:
    build: .
    image: bageo-call-agent
    container_name: bageo-call
    restart: unless-stopped
    ports:
      # Bind to one address of the host (e.g. "192.168.1.20:8787:8787") to keep
      # it off other networks.
      - "8787:8787"
    environment:
      # Inside a container the agent is reachable from the network: both
      # tokens are required here.
      CALLS_UI_TOKEN: ${CALLS_UI_TOKEN:?set CALLS_UI_TOKEN in .env}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?set DEVICE_TOKEN in .env}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CALLS_RETENTION_DAYS: ${CALLS_RETENTION_DAYS:-7}
      # Time zone of the times in notifications and of "today", e.g. Asia/Taipei.
      # Taken from .env or the shell; not set = the host's zone, read from the
      # /etc/localtime mounted below. (Left without a value on purpose: an empty
      # TZ would mean UTC.)
      TZ:
    volumes:
      - calls_data:/data/calls
      # The host's time zone (Linux hosts). On Docker Desktop for Windows or
      # macOS remove this line and set TZ in .env instead.
      - /etc/localtime:/etc/localtime:ro

volumes:
  calls_data:
