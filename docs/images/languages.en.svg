  <title id="t">Bageo speaks nine languages: English, Traditional Chinese, Simplified Chinese, Japanese, Korean, Spanish, French, German and Portuguese. Each one answers with its own hello.</title>
  <style>
    .p{animation:p 10.8s linear infinite}
    @keyframes p{0%{opacity:0}2%,9%{opacity:1}11.1%,100%{opacity:0}}
    .w1{animation:wv 1.3s ease-in-out infinite}
    .w2{animation:wv 1.3s ease-in-out .3s infinite}
    @keyframes wv{0%,100%{opacity:.2}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.p,.w1,.w2{animation:none}}
  </style>
