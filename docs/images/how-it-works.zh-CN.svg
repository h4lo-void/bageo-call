  <text x="120" y="169" text-anchor="middle" font-size="12.5" fill="#B5B5C0">打来的人，或你要找的人</text>
  <rect x="258" y="58" width="164" height="128" rx="18" fill="#24242B" stroke="#3A3A44" stroke-width="1.5"/>
  <rect x="326" y="73" width="28" height="46" rx="6" fill="none" stroke="#F2F2F5" stroke-width="3"/>
  <line x1="336" y1="80" x2="344" y2="80" stroke="#F2F2F5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M334 91 h8 l4 4 v12 h-12 z" fill="#FFCF4A"/>
  <text x="340" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">备用手机</text>
  <text x="340" y="169" text-anchor="middle" font-size="12.5" fill="#B5B5C0">已 root，插着你的 SIM</text>
  <rect x="478" y="58" width="164" height="128" rx="18" fill="#FFCF4A" stroke="#FFCF4A" stroke-width="1.5"/>
