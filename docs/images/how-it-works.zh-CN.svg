<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t" xml:lang="zh-Hans" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif">
<!-- SPDX-FileCopyrightText: h4lo-void <https://github.com/h4lo-void/bageo-call> -->
  <title id="t">Bageo 的工作原理：对方通过运营商网络打到你的备用手机（已 root、插着你的 SIM），手机用 USB 或 Wi-Fi 把通话声音交给你电脑上的 Bageo 程序，再由它和 Gemini Live 对话。录音留在你的硬盘，通知发到 32 种渠道，一切在网页控制台里管理。</title>
  <style>
    .fr{animation:fr 1s linear infinite}
    .fl{animation:fl 1s linear infinite}
    @keyframes fr{to{stroke-dashoffset:-20.2}}
    @keyframes fl{to{stroke-dashoffset:20.2}}
    @media (prefers-reduced-motion:reduce){.fr,.fl{animation:none}}
  </style>
  <rect x=".75" y=".75" width="898.5" height="328.5" rx="24" fill="#1B1B1F" stroke="#3A3A44" stroke-width="1.5"/>
  <text x="38" y="36" font-size="14" font-weight="700" fill="#9A9AA5">一通电话怎么走</text>
  <rect x="38" y="58" width="164" height="128" rx="18" fill="#24242B" stroke="#3A3A44" stroke-width="1.5"/>
  <circle cx="120" cy="88" r="9.5" fill="#F2F2F5"/>
