  <text x="450" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">通知</text>
  <text x="450" y="288" text-anchor="middle" font-size="12.5" fill="#B5B5C0">Telegram、Discord、飞书等 32 种</text>
  <rect x="612" y="244" width="250" height="58" rx="14" fill="#24242B" stroke="#3A3A44" stroke-width="1.5"/>
  <text x="737" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">网页控制台</text>
  <text x="737" y="288" text-anchor="middle" font-size="12.5" fill="#B5B5C0">设置、通话记录、AI 代打</text>
</svg>
