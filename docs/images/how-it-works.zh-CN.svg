  <line class="fr" x1="650" y1="116" x2="690" y2="116" stroke="#FFCF4A" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10"/>
  <line class="fl" x1="650" y1="128" x2="690" y2="128" stroke="#F2F2F5" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10"/>
  <text x="670" y="206" text-anchor="middle" font-size="12.5" fill="#9A9AA5">互联网</text>
  <path d="M560 186 V228 M163 244 V228 H737 V244 M450 228 V244" fill="none" stroke="#5A5A66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="38" y="244" width="250" height="58" rx="14" fill="#24242B" stroke="#3A3A44" stroke-width="1.5"/>
  <text x="163" y="268" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">你的硬盘</text>
  <text x="163" y="288" text-anchor="middle" font-size="12.5" fill="#B5B5C0">录音、文字记录、摘要都留在这里</text>
