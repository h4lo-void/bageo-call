  <g stroke="#FFCF4A" stroke-width="3" stroke-linecap="round"><line x1="772" y1="96" x2="772" y2="102"/><line x1="779" y1="92" x2="779" y2="104"/><line x1="786" y1="96" x2="786" y2="102"/></g>
