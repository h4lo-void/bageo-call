<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 401" width="760" height="401" role="img" aria-labelledby="t" xml:lang="zh-Hant" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif">
<!-- SPDX-FileCopyrightText: h4lo-void <https://github.com/h4lo-void/bageo-call> -->
  <title id="t">一次 AI 代打。你交代：訂明天晚上 7 點 4 位，7 點半也可以。AI 以小明助理的身分打給餐廳；7 點客滿，餐廳問 7 點半可不可以，AI 答應。結果：辦好了，明天晚上 7 點半、4 位，可以一鍵加入行事曆。</title>
  <style>
    .a0{animation:k0 13.5s ease-out infinite}
    @keyframes k0{0%,5.9%{opacity:0;transform:translateY(10px)}9.3%,94.8%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    .a1{animation:k1 13.5s ease-out infinite}
    @keyframes k1{0%,15.6%{opacity:0;transform:translateY(10px)}18.9%,94.8%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    .a2{animation:k2 13.5s ease-out infinite}
    @keyframes k2{0%,25.2%{opacity:0;transform:translateY(10px)}28.5%,94.8%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    .a3{animation:k3 13.5s ease-out infinite}
    @keyframes k3{0%,34.8%{opacity:0;transform:translateY(10px)}38.1%,94.8%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    .a4{animation:k4 13.5s ease-out infinite}
    @keyframes k4{0%,44.4%{opacity:0;transform:translateY(10px)}47.8%,94.8%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){[class^="a"]{animation:none}}
  </style>
  <clipPath id="card"><rect width="760" height="401" rx="24"/></clipPath>
  <rect x=".75" y=".75" width="758.5" height="399.5" rx="24" fill="#1B1B1F" stroke="#3A3A44" stroke-width="1.5"/>
  <circle cx="44" cy="32" r="17" fill="#FFCF4A"/>
  <g fill="none" stroke="#1B1B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="38" y1="38" x2="50" y2="26"/><polyline points="41,26 50,26 50,35"/></g>
  <text x="74" y="38" font-size="18" font-weight="700" fill="#FFFFFF">AI 代打：訂位</text>
  <rect x="607" y="18" width="129" height="28" rx="14" fill="none" stroke="#FFCF4A" stroke-width="1.5"/>
  <text x="671.5" y="37" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFCF4A">以你的助理身分</text>
  <line x1="0" y1="64" x2="760" y2="64" stroke="#34343B" stroke-width="1.5"/>
  <g class="a0">
    <rect x="28" y="84" width="704" height="67" rx="14" fill="#24242B" stroke="#5A5A66" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="46" y="110" font-size="13" font-weight="700" fill="#FFCF4A">你交代的事</text>
    <text x="46" y="135" font-size="17" fill="#F2F2F5">訂明天晚上 7 點 4 位，7 點半也可以。</text>
  </g>
  <g class="a1">
    <circle cx="714" cy="190" r="18" fill="#FFCF4A"/>
    <text x="714" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1B1B1F">AI</text>
    <rect x="247" y="169" width="439" height="42" rx="18" fill="#FFCF4A"/>
    <text x="263" y="196.5" font-size="18" fill="#1B1B1F" font-weight="600">您好，我是小明的助理，想訂明天晚上 7 點 4 位。</text>
  </g>
  <g class="a2">
    <circle cx="46" cy="246" r="18" fill="#3A3A44"/>
    <circle cx="46" cy="241" r="5.5" fill="#B5B5C0"/>
    <path d="M36 257 a10 9 0 0 1 20 0 z" fill="#B5B5C0"/>
    <rect x="74" y="225" width="357" height="42" rx="18" fill="#2C2C34"/>
    <text x="90" y="252.5" font-size="18" fill="#F2F2F5">不好意思，7 點客滿了，7 點半可以嗎？</text>
  </g>
  <g class="a3">
    <circle cx="714" cy="302" r="18" fill="#FFCF4A"/>
    <text x="714" y="307" text-anchor="middle" font-size="14" font-weight="800" fill="#1B1B1F">AI</text>
    <rect x="398" y="281" width="288" height="42" rx="18" fill="#FFCF4A"/>
    <text x="414" y="308.5" font-size="18" fill="#1B1B1F" font-weight="600">7 點半可以，訂位名字是小明。</text>
  </g>
  <g class="a4">
    <g clip-path="url(#card)"><rect x="0" y="345" width="760" height="56" fill="#0E8F8F"/></g>
    <text x="380" y="378.8" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">辦好了 ・ 明天晚上 7:30 ・ 4 位 ・ 一鍵加入行事曆</text>
  </g>
</svg>
