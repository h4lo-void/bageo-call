name: Release

# Push a tag like v0.2.0 to build the downloads and attach them to a GitHub
# Release:
#   myna-call-<version>-windows-x64.zip
#   myna-call-<version>-macos-arm64.tar.gz / -macos-x64.tar.gz
#   myna-call-<version>-linux-x64.tar.gz
#   pixelcallai_uplink-<version>.zip          (phone module, flash in Magisk / KernelSU)
#
# Each desktop download holds the agent program, the bundled sounds, the start
# scripts and the documents: unpack and run the start script.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent:
    name: agent ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: agent.exe }
          - { os: macos-latest, name: macos-arm64, exe: agent }
          - { os: macos-15-intel, name: macos-x64, exe: agent }
          - { os: ubuntu-22.04, name: linux-x64, exe: agent }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p agent
      - name: Build
        run: cargo build --release -p agent
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="myna-call-${GITHUB_REF_NAME#v}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp "target/release/${{ matrix.exe }}" "dist/$dir/"
          cp -R assets docs "dist/$dir/"
          cp README*.md LICENSE NOTICE.md .env.example "dist/$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp start.ps1 start.cmd "dist/$dir/"
            (cd dist && 7z a -tzip "$dir.zip" "$dir" > /dev/null)
          else
            cp start.sh start.command "dist/$dir/"
            chmod +x "dist/$dir/agent" "dist/$dir/start.sh" "dist/$dir/start.command"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  android:
    name: phone module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Sign with the project's own key when the repository has one, so an
      # update installs over the previous release. Without the secrets the APK
      # is signed with a throw-away debug key (fine for a first install; to
      # move between differently signed builds remove the module first).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PCA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build and package the module
        working-directory: android
        env:
          PCA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PCA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PCA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/package-uplink-module.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phone-module
          path: android/magisk/dist/*.zip

  # Publishes whatever was built, as long as there is the phone module and at
  # least one desktop download. When a system did not get a build machine,
  # re-run the failed jobs: this job then runs again and adds the missing
  # files to the same Release.
  publish:
    needs: [agent, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check what was built
        run: |
          ls -l dist
          ls dist/pixelcallai_uplink-*.zip dist/myna-call-* > /dev/null
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
