name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test -p agent
      - name: Test packs
        run: cargo test -p bageo-packs
      - name: Build
        run: cargo build --release -p agent

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
      - name: Test
        # The tests are plain logic; one system is enough. (A test program
        # built on Windows does not get the manifest the window toolkit needs.)
        if: runner.os == 'macOS'
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        run: |
          sh scripts/package-macos.sh target/release/bageo-status dist
          tar -C dist -czf bageo-status-macos-arm64.tar.gz "Bageo Status.app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: bageo-status-windows-x64
          path: desktop/target/release/bageo-status.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS'
        with:
          name: bageo-status-macos-arm64
          path: desktop/bageo-status-macos-arm64.tar.gz

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build Android arm64 Rust library
        run: bash android/scripts/build-rust-android.sh
      - name: Build APKs and run unit tests (bridge + standalone)
        working-directory: android
        run: sh ./gradlew :app:assembleBridgeRelease :app:assembleStandaloneRelease :app:testBridgeDebugUnitTest :app:testStandaloneDebugUnitTest --no-daemon
      - name: Build the phone audio helper (arm64-v8a, armeabi-v7a)
        env:
          BAGEO_RUST_TOOLCHAIN: "1.97.0"
          BAGEO_NDK_VERSION: "27.3.13750724"
          BAGEO_BUILD_TOOLS_VERSION: "35.0.0"
        run: |
          rustup toolchain install "$BAGEO_RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android --target armv7-linux-androideabi
          bash android/scripts/build-roothelper.sh
      - name: Package & verify bridge and standalone modules
        working-directory: android
        run: |
          bash scripts/package-uplink-module.sh
          bash scripts/package-uplink-module.sh --standalone --skip-rust-build
      - name: Check the audio helper is in the phone modules
        run: bash android/scripts/check-roothelper-in-module.sh android/magisk/dist/bageo-phone-*.zip
      # The helper alone (both ABIs and the parameter jar), for trying it on a phone
      # without flashing a module.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bageo-audio-helper
          path: android/magisk/pixelcallai_uplink/roothelper/
      - name: Check the app in both modules is not debuggable
        run: bash android/scripts/check-not-debuggable.sh android/magisk/dist/bageo-phone-module-*.zip android/magisk/dist/bageo-phone-standalone-*.zip
      - name: Test the phone module's mode scripts
        run: sh android/magisk/tests/test_mode_scripts.sh

  roothelper:
    name: phone audio helper
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android/roothelper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: clippy
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the phone builds (arm64-v8a, armeabi-v7a)
        run: |
          cargo clippy --locked --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --locked --all-targets --target armv7-linux-androideabi -- -D warnings

  i18n:
    name: i18n (Android app locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check the 79 Android app locales, folder qualifiers and format tokens
        run: cargo test -p bageo-packs --test exported_files

  sms-forward:
    name: sms_forward tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: tools/sms_forward
        run: python -m unittest -v

  audit:
    name: dependency audit (${{ matrix.lock }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Bageo workspace, the desktop program's and the phone audio helper's.
        lock: [Cargo.lock, desktop/Cargo.lock, android/roothelper/Cargo.lock]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked --version 0.23.0
      - name: Check the dependencies against the RustSec advisories
        run: cargo audit --file ${{ matrix.lock }}
