name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p agent
      - name: Test packs
        run: cargo test -p bageo-packs
      - name: Build
        run: cargo build --release -p agent

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        # The tests are plain logic; one system is enough. (A test program
        # built on Windows does not get the manifest the window toolkit needs.)
        if: runner.os == 'macOS'
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        run: |
          sh scripts/package-macos.sh target/release/bageo-status dist
          tar -C dist -czf bageo-status-macos-arm64.tar.gz "Bageo Status.app"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: bageo-status-windows-x64
          path: desktop/target/release/bageo-status.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: bageo-status-macos-arm64
          path: desktop/bageo-status-macos-arm64.tar.gz

  android:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK and run unit tests
        working-directory: android
        run: sh ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

  i18n:
    name: i18n (exported translations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the folder names, language list and arguments in the exported files
        run: cargo test -p bageo-packs --test exported_files
      - name: Read the pinned translations
        id: ref
        # tools/bageo-packs.ref holds the bageo-packs commit the files came from.
        # Until that repository is published it holds a source name instead, and
        # the comparison below has nothing to fetch.
        run: |
          pin=$(tr -d '[:space:]' < tools/bageo-packs.ref)
          if echo "$pin" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit=$pin" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tools/bageo-packs.ref is not a bageo-packs commit yet; skipping export-app --check"
          fi
      - name: Get the pinned translations (bageo-packs)
        if: steps.ref.outputs.commit != ''
        uses: actions/checkout@v4
        with:
          repository: h4lo-void/bageo-packs
          ref: ${{ steps.ref.outputs.commit }}
          path: packs
      - name: Exported files match the translations
        if: steps.ref.outputs.commit != ''
        run: >
          cargo run -p bageo-packs --release -- export-app
          --packs packs
          --android android/app/src/main/res
          --desktop desktop/ui/i18n.ext.json
          --commit ${{ steps.ref.outputs.commit }}
          --check

  sms-forward:
    name: sms_forward tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: tools/sms_forward
        run: python -m unittest -v
