lang: ja
name: 日本語
regions: ["日本"]
sources:
  S1: {title: "警察庁 SOS47：オレオレ詐欺（会話例・実際の音声）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/oreore/"}
  S2: {title: "警察庁 SOS47：還付金詐欺（会話例）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/refund/"}
  S3: {title: "警察庁 SOS47：預貯金詐欺（会話例）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/deposits/"}
  S4: {title: "警察庁 SOS47：キャッシュカード詐欺盗", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/cashcard/"}
  S5: {title: "警察庁 SOS47：架空料金請求詐欺（会話例・SMS 文面）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/fictitious-billing/"}
  S6: {title: "警察庁 SOS47：その他の手口（融資保証金・金融商品・ギャンブル・交際あっせん）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/case/special/"}
  S7: {title: "警察庁 SOS47：ニセ警察詐欺に注意！（実際の文言・自動音声）", url: "https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/241218/02.html"}
  S8: {title: "警視庁：犯人の音声コーナー（実録音声の一覧）", url: "https://action.digipolice.keishicho.metro.tokyo.lg.jp/list/sound"}
  S9: {title: "長崎県警察：犯人からの電話（実際の音声）", url: "https://www.police.pref.nagasaki.jp/police/kurashi/tokushu-sagi/onsei/"}
categories:
  police_prosecutor:
    sources: [S7, S8, S9]
    phrases:
      - "!あなた名義の口座が不正に開設されており、あなたも資金洗浄事件の容疑者になっている。｜你名下的帳戶被違法開設，你也成了洗錢案嫌疑人。"
      - "!犯人を逮捕したところ、自宅からあなた名義のキャッシュカードが見つかった。｜逮捕犯人時，在他家找到你名下的提款卡。"
      - "!あなたが犯罪に関与している疑いがあるので、電話で取り調べを行う。｜你涉嫌參與犯罪，要在電話中偵訊。"
      - "!口座の資金を全て確認する必要がある。｜必須確認你帳戶的全部資金。"
      - "!一度お金を全て振り込んでもらい、資金調査を行う必要がある。｜需要你先把錢全部匯過來做資金調查。"
      - "!あなたの携帯電話が不正に契約された。｜你的手機被違法申辦。"
      - "!警視庁捜査二課の者です。〇〇県警からの捜査協力要請を受けて連絡しています。｜我是警視廳搜查二課，受某縣警請求協助調查而聯絡你。"
      - "!〇〇県警まで来ることは可能ですか？来られないのであればビデオ通話で取り調べをします。｜你能到某縣警來嗎？不能來就用視訊偵訊。"
      - "あなたに逮捕状が出ています。｜已經對你發出逮捕令。"
      - "この件は捜査上の秘密なので、ご家族にも話さないでください。｜這是偵查機密，家人也不要說。"
      - "LINE を追加してください。ビデオ通話で警察手帳をお見せします。｜請加 LINE，我用視訊給你看警察手帳。"
      - "インターネットで私の名前を検索してみてください。｜請上網搜尋我的名字。"
      - "資産を保護するため、財産をいったん私たちが管理します。｜為了保護資產，先由我們管理你的財產。"
      - "身の潔白を証明するために、指定の口座に送金してください。｜為了證明清白，請匯到指定帳戶。"
      - "金融庁の職員があなたの自宅にキャッシュカードを受け取りに行きます。｜金融廳職員會到你家收取提款卡。"
      - "暗証番号も確認のために教えてください。｜為了確認也請告訴我密碼。"
      - "封筒にカードを入れて封をして、印鑑を取ってきてください。｜把卡放進信封封好，去拿印章來。（掉包手法）"
      - "金の延べ棒を購入して、指示する住所に郵送してください。｜購買金條，郵寄到指示的地址。"
      - "詐欺犯人から押収した名簿にあなたの名前がありました。｜從詐騙犯扣押的名冊上有你的名字。"
      - "逮捕した容疑者の名前に心当たりはありますか？｜你認識被逮捕嫌犯的名字嗎？"
      - "保釈金として〇〇万円を指定口座に振り込んでください。捜査終了後に返金されます。｜請將保釋金匯入指定帳戶，偵查結束後退還。"
      - "誓約書にサインしてください。この件を口外しないという内容です。｜請簽保密切結書。"
    strong: [資金洗浄, マネーロンダリング, 逮捕状, 資金調査, 電話で取り調べ, ビデオ通話で取り調べ, 警察手帳, 身の潔白, 資産を保護, 捜査協力要請, 押収した名簿, 保釈金, 口座が不正に開設, 不正に契約, 誓約書, 捜査上の秘密, 金の延べ棒, 金地金]
    keywords: [警視庁, 捜査二課, 県警, 警察官, 検察官, 金融庁, 容疑者, 逮捕, 起訴, 凍結, 捜査]
    hard: [資金調査, 電話で取り調べ, ビデオ通話で取り調べ]
    requests: ["指定口座へ振込｜匯到指定帳戶", "ネットバンキングで送金｜網銀匯款", "キャッシュカードと暗証番号を渡す｜交出提款卡與密碼", "金地金を購入・郵送｜買金條郵寄", "LINE でビデオ通話｜LINE 視訊", "家族に話さない｜不告訴家人"]
    tactics: ["実在の警察署番号を偽装表示｜偽造真實警察署號碼", "末尾0110の国際電話｜結尾0110的國際電話", "偽の警察手帳・逮捕状を見せる｜出示假警察手帳逮捕令", "電話会社→警察へ交代｜電話公司→警察接力"]
  telecom_number:
    sources: [S7]
    phrases:
      - "!２時間後からこの電話は使えなくなります。｜兩小時後這支電話將無法使用。"
      - "!使用する場合は１番を押してください。｜若要繼續使用請按 1。"
      - "総務省の者ですが、あなた名義の携帯電話が犯罪に使われています。｜我是總務省，你名下的手機被用於犯罪。"
      - "携帯電話の未納料金があります。｜你有手機未繳費用。"
      - "警察に被害届を出す必要があるので、担当の警察官におつなぎします。｜需要向警方報案，我幫你轉接負責的警察。"
      - "NTT ドコモの者です。あなたの名前で新しい回線が契約されています。｜我是 NTT docomo，有人以你的名字申辦新門號。"
    strong: [２時間後, 使えなくなります, １番を押して, 未納料金, 警察官におつなぎ, 新しい回線が契約]
    keywords: [総務省, NTT, ドコモ, 携帯電話会社, 回線]
    requests: ["ボタンを押す｜按鍵", "警察へ転送｜轉接警察"]
    tactics: ["自動音声｜自動語音", "警察役へ交代｜換成警察角色"]
  family_emergency:
    sources: [S1, S8, S9]
    phrases:
      - "!会社のお金が入ったカバンを落としてしまった！今日中にお金がいるんだけど、何とかならない？｜我把裝公司錢的包包弄丟了！今天就需要錢，能想想辦法嗎？"
      - "!銀行で引出理由を聞かれたら、リフォーム代とか、身内に不幸があったなどと言って、上手くごまかしてね。｜銀行問你提款理由，就說是裝修或家裡有喪事，好好矇混過去。"
      - "!自分は落とし物の届け出があって行けないので、代わりに同僚に行ってもらうね。｜我要去報失物不能去，請同事代替我去拿。"
      - "!風邪をひいて声が変わった。｜我感冒了聲音變了。"
      - "!携帯が壊れて番号が変わった。｜手機壞了換號碼了。"
      - "俺だけど、株を買うために会社の金を使い込んでしまった。｜是我啦，我為了買股票挪用了公司的錢。"
      - "監査が入るので、それまでにお金を戻さないとクビになる。｜要被稽核了，在那之前不把錢補回去就會被開除。"
      - "弁護士にも相談しているけど、このままだと逮捕されるかもしれない。｜我也找了律師，但這樣下去可能會被逮捕。"
      - "痴漢で捕まってしまった。示談金を払えば前科がつかない。｜我因為色狼被抓了，付和解金就不會有前科。"
      - "交通事故を起こして、相手が妊婦さんなんだ。｜我出車禍，對方是孕婦。"
      - "上司に代わるね。｜我換上司跟你講。"
      - "桃を送ったよ。（後日）実は困ったことになって…｜我寄了桃子給你喔。（之後）其實我遇到麻煩了…"
      - "このことはお父さんには言わないで。｜這件事不要跟爸爸說。"
      - "弁護士の〇〇です。息子さんが起こした事故の示談金が必要です。｜我是律師某某，需要你兒子車禍的和解金。"
    strong: [会社の金を使い込んで, カバンを落とした, 今日中にお金がいる, 示談金, 同僚に行ってもらう, 引出理由, 上手くごまかして, 声が変わった, 番号が変わった, 監査が入る, 前科がつかない]
    keywords: [俺だけど, 俺俺, 息子, 孫, 弁護士, 上司, 交通事故, 痴漢, 逮捕]
    requests: ["現金を受け子に手渡し｜把現金交給取款人", "銀行で嘘の理由を言う｜在銀行說假理由", "宅配便で現金送付｜宅配寄現金"]
    tactics: ["風邪・番号変更の前振り｜先鋪陳感冒或換號", "上司・弁護士役に交代｜換上司或律師", "受け子が来る｜派取款人"]
  guess_who:
    sources: [S1, S9]
    phrases:
      - "俺だよ、俺。わからない？｜是我啦，我，認不出來嗎？"
      - "携帯の番号が変わったから登録しておいて。｜手機號碼換了，存一下。"
      - "明日また電話するね。｜明天再打給你。"
    strong: [俺だよ, 番号が変わったから登録]
    keywords: [わからない, 新しい番号]
    requests: ["新番号登録｜登錄新號碼"]
    tactics: ["前日の予兆電話｜前一天預告電話"]
  tax_benefit_refund:
    sources: [S2, S8, S9]
    phrases:
      - "!年金支給が一部未払いとなっておりましたので、受け取る手続きをしてください。｜年金有部分未支付，請辦理領取手續。"
      - "!以前に青色の封筒を送りましたが、ご確認されてないですか？払い戻し期限が今日までとなっているので、お電話しています。｜之前寄了藍色信封，你沒確認嗎？退款期限到今天，所以打給你。"
      - "!お近くのATMでお手続きができますので、今から携帯電話を持ってATMに向かってください。｜在附近 ATM 就能辦，現在帶手機去 ATM。"
      - "!着いたらお電話いただければ、操作方法を説明します。｜到了打給我，我說明操作方法。"
      - "!操作方法を説明しますので、私が言ったとおりにボタンを押してください。｜我說明操作，請照我說的按鍵。"
      - "!保険料の払い戻し申請書を送ったのですが確認しましたか？｜寄了保險費退款申請書，你確認了嗎？"
      - "!払いすぎていた金額があったのでお戻しします。｜有溢繳的金額要退給你。"
      - "〇〇区役所保険年金課の者です。累積医療費が戻ります。｜我是某區公所保險年金課，累積醫療費可以退回。"
      - "銀行の担当者から折り返しお電話させます。｜我請銀行負責人回電給你。"
      - "スーパーなど人の少ないATMに行ってください。｜請去超市等人少的 ATM。"
      - "お受け取り番号を入力してください。｜請輸入領取號碼。"
      - "新型コロナの臨時医療給付金があります。｜有新冠臨時醫療給付金。"
      - "ご家族は今ご在宅ですか？｜家人現在在家嗎？"
    strong: [払い戻し期限, 還付金, 医療費の還付, 累積医療費, ATMに向かって, 携帯電話を持ってATM, 未払い, 払いすぎていた, 青色の封筒, 臨時医療給付金, お受け取り番号, ATMで還付金, 還付金はATMで]
    keywords: [区役所, 市役所, 保険年金課, 税務署, 年金事務所, 払い戻し, 保険料, 年金, ATMで手続き]
    hard: [ATMに向かって, 携帯電話を持ってATM, ATMで還付金, 還付金はATMで]
    requests: ["携帯を持ってATMへ｜帶手機去 ATM", "指示通りボタン操作｜照指示按鍵"]
    tactics: ["期限は今日まで｜期限是今天", "人の少ないATMを指定｜指定人少的 ATM", "役所→銀行員のリレー｜公所→行員接力"]
  bank_card_alert:
    sources: [S3, S4, S8]
    phrases:
      - "!医療費(保険料)の払戻しがありまして、振り込みのためには今お使いのキャッシュカードを変更する必要があります。｜有醫療費退款，為了匯款需要更換你現在用的提款卡。"
      - "!のちほど、銀行協会の方から手続きについてお電話でご案内いたします。｜稍後銀行協會會打電話說明手續。"
      - "!新しいキャッシュカードを作るので、今からキャッシュカードを自宅に取りに行きます。手続きのため暗証番号も教えていただけますか？｜要做新卡，現在去你家拿卡，為了手續也請告訴我密碼。"
      - "全国銀行協会の者です。キャッシュカードから個人情報が漏れています。｜我是全國銀行協會，你的提款卡個資外洩了。"
      - "!あなたの名義のキャッシュカードで買い物をした犯人がいます。｜有犯人用你名下的提款卡購物。"
      - "百貨店の者ですが、あなたのカードで高額な買い物をしようとした人がいます。｜我是百貨公司，有人想用你的卡大額購物。"
      - "偽造カードが悪用されているので、カードを止める必要があります。｜偽卡被濫用，必須停卡。"
      - "職員がお伺いしますので、カードを封筒に入れて準備してください。｜職員會去拜訪，請把卡放進信封準備好。"
      - "みずほ銀行です。お客様の口座が不正利用されています。（音声ガイダンス）｜這是瑞穗銀行，您的帳戶被盜用。（語音）"
    strong: [キャッシュカードを変更, キャッシュカードを取りに行きます, 暗証番号も教えて, 個人情報が漏れて, 偽造カード, カードを封筒に入れて, 銀行協会, 不正利用]
    keywords: [全国銀行協会, 百貨店, キャッシュカード, 暗証番号, 口座, 職員がお伺い]
    requests: ["暗証番号を教える｜告知密碼", "カードを渡す・すり替え｜交出卡片或被掉包"]
    tactics: ["自宅訪問で受け取り｜到府收卡", "封筒すり替え｜信封掉包"]
  debt_collection:
    sources: [S5]
    phrases:
      - "!早急にお支払いが必要です。延滞料金は毎日加算されますし、◯日までに料金を支払わないと裁判になります。｜必須立刻付款，滯納金每天累加，某日前不付就會上法院。"
      - "!コンビニエンスストアで電子マネーカードを購入して、カード番号を教えてください。｜請到便利商店買電子錢卡，告訴我卡號。"
      - "!払わなければ裁判になる。｜不付款就打官司。"
      - "!今日払えば大半が返金される。｜今天付的話大部分會退還。"
      - "有料サイトの利用料金が未納です。｜付費網站的使用費未繳。"
      - "保険が使えるから全額返金されます。｜可以用保險，所以會全額退款。"
      - "法務省管轄の民間訴訟告知センターです。｜這裡是法務省管轄的民間訴訟告知中心。"
      - "NTTファイナンスの者です。未払いの料金があります。｜我是 NTT Finance，有未付費用。"
    strong: [裁判になります, 電子マネーカード, カード番号を教えて, 有料サイト, 未納, 訴訟告知センター, 今日払えば返金, 延滞料金]
    keywords: [利用料金, 法務省, 裁判所, NTTファイナンス, 少額訴訟, 強制執行]
    requests: ["電子マネー購入・番号伝達｜買電子錢告知卡號"]
    tactics: ["裁判をちらつかせる｜以訴訟恐嚇", "返金を約束｜承諾退款"]
  gift_card_payment:
    sources: [S5, S8]
    phrases:
      - "コンビニでアップルカードを買って、裏の番号を読み上げてください。｜在便利商店買 Apple 卡，唸出背面號碼。"
      - "電子マネーで支払ってください。Amazonギフト券でも大丈夫です。｜請用電子錢支付，Amazon 禮品卡也可以。"
      - "サポート代として電子マネーを購入してください。｜請購買電子錢作為支援費用。"
    strong: [電子マネーを購入, 裏の番号を読み上げ, ギフト券の番号, アップルカードを買って]
    keywords: [電子マネー, ギフト券, ギフトカード, Google Play カード, iTunes カード, プリペイドカード]
    hard: [裏の番号を読み上げ, ギフト券の番号]
    requests: ["電子マネー購入｜購買電子錢"]
    tactics: ["コンビニ店員に止められないよう指示｜教你避免被店員阻止"]
  tech_support:
    sources: [S5, S8]
    phrases:
      - "日本マイクロソフトのサポートセンターです。パソコンがウイルスに感染しています。｜這是日本微軟支援中心，您的電腦感染病毒。"
