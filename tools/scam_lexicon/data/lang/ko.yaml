lang: ko
name: 한국어
regions: ["대한민국"]
sources:
  S1: {title: "금융위원회·금융감독원 보도자료：보이스피싱 대응요령 10선（실제 수법 예시 포함）", url: "https://www.fsc.go.kr/no010101/86250"}
  S2: {title: "금융감독원 보이스피싱지킴이：주요 사기유형", url: "https://www.fss.or.kr/fss/main/contents.do?menuNo=200565"}
  S3: {title: "금융감독원 보이스피싱 체험관 '바로 이 목소리（그놈 목소리）' 목록", url: "https://fss.or.kr/fss/bbs/B0000203/list.do?menuNo=200686"}
  S4: {title: "중앙일보：경찰 사칭하던 '그놈 목소리' 요즘은 '고객님 오늘 대출 받으시려면…'", url: "https://www.joongang.co.kr/article/19862794"}
  S5: {title: "이투데이：금감원, 대출권유 보이스피싱 '그놈목소리' 추가 공개（햇살론 사칭）", url: "https://www.etoday.co.kr/news/view/1382583"}
  S6: {title: "금융감독원 소비자경보（2025.5）：저금리 대출의 유혹（하나은행 게시 PDF）", url: "https://image.kebhana.com/cont/customer/customer04/customer0408/__icsFiles/afieldfile/2025/06/10/customer0408_img_250610.pdf"}
  S7: {title: "SBS：'엄마, 나 폰 액정 깨졌어' 메신저피싱", url: "https://news.sbs.co.kr/news/endPage.do?news_id=N1006455042"}
categories:
  police_prosecutor:
    sources: [S1, S2, S3]
    phrases:
      - "!□□은행에서 ○○○씨 명의로 계좌가 만들어져 불법자금세탁 사건의 대포통장으로 이용됐고, 피해자 50명이 집단 고소장을 접수한 상황입니다.｜有人以你名義在某銀行開戶，被當成非法洗錢案的人頭帳戶，50 名被害人已集體提告。"
      - "!전자금융거래법 위반, 국제금융거래법 위반, 자금세탁법 위반 등 혐의입니다.｜涉嫌違反電子金融交易法、國際金融交易法、洗錢法。"
      - "!이건 특급 보안사건으로서 구속·비공개수사가 원칙입니다.｜這是特級保密案件，原則上羈押、不公開偵查。"
      - "!이 사건에는 은행과 통신사, 경찰이 모두 연루되어 있으므로 절대로 아무한테도 말하면 안 됩니다.｜這案子銀行、電信、警察都有牽涉，絕對不能告訴任何人。"
      - "!이제부터 당신의 자산이 범죄에 연루된 불법자금이 아닌지 조사해야 합니다.｜現在開始要調查你的資產是否為涉案非法資金。"
      - "!구속수사가 아닌 약식수사를 받으려면 금융감독원에 본인이 직접 출입하여 휴대폰에 대해 디지털 포렌식을 해야 합니다.｜若要接受簡易偵查而非羈押，你必須親自到金融監督院對手機做數位鑑識。"
      - "!다른 사람 목소리가 섞이면 안 되니까 혼자 조용히 머물 수 있는 곳으로 가세요. 근처에 호텔이나 모텔 등 숙박업소가 있나요?｜不能混入別人聲音，去一個能獨處安靜的地方，附近有飯店或汽車旅館嗎？"
      - "!본 건으로 발생하는 경비는 비용처리를 해줄테니 근처 저렴한 모텔에 입실하도록 하세요.｜這件事的費用會幫你報銷，去附近便宜的汽車旅館入住。"
      - "서울중앙지검 첨단범죄수사부 ○○○ 검사입니다.｜我是首爾中央地檢尖端犯罪調查部的某某檢察官。"
      - "수사 중이니 전화를 끊으시면 안 됩니다.｜正在偵查中，不能掛電話。"
      - "피해자 계좌 보호를 위해 안전계좌로 이체하셔야 합니다.｜為了保護帳戶必須轉到安全帳戶。"
      - "국가안전계좌로 옮기시면 수사 끝나고 돌려드립니다.｜轉到國家安全帳戶，偵查結束後歸還。"
      - "지금 보내드리는 링크로 사건 조회를 해보세요.｜用我傳的連結查詢案件。"
      - "공문을 카카오톡으로 보내드릴게요.｜我用 KakaoTalk 傳公文給你。"
      - "현금을 인출해서 금감원 직원에게 전달하세요.｜領出現金交給金監院職員。"
      - "은행 직원이 물어보면 가족에게 빌려주는 거라고 하세요.｜銀行職員問就說是借給家人。"
    strong: [대포통장, 자금세탁, 불법자금, 비공개수사, 구속수사, 약식수사, 안전계좌, 국가안전계좌, 디지털 포렌식, 모텔, 숙박업소, 전화를 끊으시면 안, 아무한테도 말하면 안, 집단 고소장, 사건 조회, 명의도용, 검찰청 안전계좌, 자산 보호 조치, 피해자 입증]
    keywords: [검찰, 검사, 서울중앙지검, 경찰청, 수사관, 금융감독원, 금감원, 수사, 구속, 혐의, 공문]
    hard: [안전계좌, 국가안전계좌, 약식수사, 자산 보호 조치, 검찰청 안전계좌]
    requests: ["안전계좌로 이체｜轉到安全帳戶", "현금 인출 후 전달｜領現金轉交", "모텔 투숙｜入住汽車旅館", "앱 설치·링크 접속｜裝 App 或點連結", "카카오톡/텔레그램 이동｜轉到 Kakao/Telegram"]
    tactics: ["고립（모텔·혼자）｜隔離", "전화 못 끊게｜不讓掛電話", "112·1332 번호 변작 표시｜偽造 112/1332 號碼", "통화 가로채기 악성앱｜攔截通話惡意 App"]
  loan_advance_fee:
    sources: [S1, S4, S5, S6]
    phrases:
      - "!고객님 건은 원래 대출이 안 되는 건인데 편법으로 해드리는 것입니다.｜您的案件本來不能貸款，是用變通方式幫您辦的。"
      - "!거래기록을 남기지 않고 먼저 상환 처리를 해야 하기 때문에, 은행 계좌가 아닌 공증계좌로 상환하셔야 합니다.｜不能留交易紀錄要先清償，所以要還到公證帳戶而不是銀行帳戶。"
      - "!다른 분한테는 절대 이야기하지 않으셔야 추후에 저한테도 피해가 안 생긴다는 점 명심해주세요.｜請記住絕對不能跟別人說，以後我才不會受害。"
      - "!저희 은행에서 5천만 원 대출을 받으신 지 6개월도 안 됐는데, A은행에 이중으로 대출을 신청하셨네요?｜您在我們銀行貸款五千萬還不到六個月，又向 A 銀行重複申請貸款？"
      - "!금융거래법을 위반하셔서 금융전산망에 지급정지 등록을 했습니다.｜您違反金融交易法，已在金融網路登記止付。"
      - "!희망 대출금의 30%를 공탁금으로 걸어야 해결할 수 있으니 불러드리는 계좌로 이체해주세요.｜要押希望貸款額 30% 作為提存金才能解決，請轉到我報的帳戶。"
      - "!대출금리는 연 4.2% 고정금리시고, 계약기간은 3년으로 되시겠고요.｜貸款利率年 4.2% 固定，合約期間三年。"
      - "!앞으로 신용불량자가 되어 5년간 금융거래가 금지될 뿐만 아니라 정부 지원금도 못 받게 되고, 민ㆍ형사상 책임까지 지셔야 합니다.｜以後會變成信用不良者，五年內禁止金融交易，也領不到政府補助，還要負民刑事責任。"
      - "!기존 대출금 전액을 갚아야 지급 정지가 해제됩니다.｜要還清既有貸款，止付才會解除。"
      - "!저희 쪽 데이터상으로는 고객님 신용이 조금 부족하세요. 오늘 중으로 자금을 받아 보시려면 한 가지 방법밖에 없어요.｜依我們資料您的信用有點不足，想今天拿到錢只有一個方法。"
      - "!지금 OO캐피탈 쓰고 계시죠. 거기에 일부 변제를 해 주셔야 해요.｜您現在有用某某資本吧，要先還一部分。"
      - "!대출을 신청하시려면 모바일로 대출신청서를 작성하여 제출해야 합니다. 현재 설치되어있는 △△은행 앱과 ○○은행 앱, 후후 앱을 모두 삭제하세요.｜要申請貸款得用手機填申請書，請把現在裝的某某銀行 App 和 whowho App 全刪掉。"
      - "○○저축은행 선릉지점 심사부 대리입니다. 햇살론 지원 대상이십니다.｜我是某某儲蓄銀行宣陵分行審查部代理，您是 Sunshine Loan 的支援對象。"
      - "대출 실행을 위해 신용보증서 발급비용을 먼저 입금해 주세요.｜為了撥款請先匯信用保證書發行費。"
      - "신용등급 상향 작업이 필요해서 수수료가 발생합니다.｜需要提升信用等級，會產生手續費。"
      - "저금리 대환대출로 바꿔드리겠습니다.｜幫您換成低利轉貸。"
      - "정부지원 서민대출 상품이 나왔습니다.｜政府支援庶民貸款商品推出了。"
      - "대출전용 앱을 설치하셔야 합니다. 링크 보내드릴게요.｜您必須安裝貸款專用 App，我傳連結給您。"
    strong: [공증계좌, 공탁금, 보증금, 이중으로 대출, 지급정지, 기존 대출 상환, 일부 변제, 신용등급 상향, 신용보증서 발급비용, 대출전용 앱, 앱을 모두 삭제, 편법으로, 거래기록을 남기지, 대환대출, 햇살론]
    keywords: [저금리, 대출, 저축은행, 캐피탈, 정부지원, 서민대출, 신용점수, 심사부, 수수료]
    hard: [공증계좌, 앱을 모두 삭제, 대출전용 앱]
    requests: ["선입금（공탁금·보증금·보험료）｜先匯錢", "타인 계좌로 기존대출 상환｜把舊貸款還到他人帳戶", "은행앱·후후앱 삭제｜刪除銀行 App", "원격제어앱 설치｜安裝遠端控制 App", "현금 전달｜交付現金"]
    tactics: ["실제 대출과 똑같은 상담｜和真貸款一樣的諮詢", "A은행·B은행 역할극｜A/B 銀行雙簧", "문진 대비 답변 교육｜教你回答銀行問診"]
  virtual_kidnapping:
    sources: [S1, S2]
    phrases:
      - "!△△이 엄마시죠? 잠시만요, △△아, 빨리 얘기해줘.｜你是某某的媽媽吧？等一下，某某，快講話。"
      - "!흑흑... 엄마.. 아저씨가 때렸어..｜嗚嗚…媽…叔叔打我…（AI 子女聲音）"
      - "!울지 말고! 방금 내가 술 마시고 길가에서 담배를 피고 있었는데 얘가 XXXX라고 욕을 했어요.｜別哭！剛剛我喝酒在路邊抽菸，這孩子罵我髒話。"
      - "!나한테 성의 표시로 술값이라도 보내줘. 50만원만 입금해. 지금 통화 중인 상태로 입금해.｜給我一點誠意，至少付酒錢，匯 50 萬就好，現在不要掛電話直接匯。"
      - "아드님 데리고 있습니다. 경찰에 신고하면 다시는 못 봅니다.｜你兒子在我這，報警就再也見不到。"
      - "군대 간 아들이 사고가 났습니다. 합의금이 필요합니다.｜去當兵的兒子出事了，需要和解金。"
      - "유학 중인 따님이 납치됐습니다.｜留學中的女兒被綁架了。"
    strong: [통화 중인 상태로 입금, 데리고 있습니다, 경찰에 신고하면, 다시는 못 봅니다, 납치, 성의 표시]
    keywords: [엄마, 아빠, 합의금, 사고, 유학]
    requests: ["통화 유지하며 입금｜不掛電話匯款"]
    tactics: ["AI 자녀 목소리｜AI 孩子聲音", "자녀 이름·학교 언급｜說出孩子名字學校"]
  guess_who:
    sources: [S7, S2]
    phrases:
      - "엄마, 나 폰 액정 깨져서 친구 폰으로 연락해.｜媽，我手機螢幕破了，用朋友手機聯絡。"
      - "수리 맡겨서 당분간 이 번호로 연락해줘.｜送修了，這陣子打這個號碼。"
      - "문화상품권 사서 핀 번호 좀 보내줘.｜買文化商品券把 PIN 碼傳給我。"
      - "신분증 사진이랑 계좌번호 보내줘, 보험금 받아야 해.｜傳身分證照片和帳號給我，要領保險金。"
      - "팀뷰어 앱 깔아줘, 내가 설정해줄게.｜裝 TeamViewer，我幫你設定。"
    strong: [액정 깨져서, 친구 폰으로, 핀 번호 보내줘, 신분증 사진, 팀뷰어]
    keywords: [엄마, 수리, 이 번호로, 상품권]
    hard: [핀 번호 보내줘]
    requests: ["상품권 핀번호｜商品券 PIN", "신분증 사진｜身分證照片", "원격앱 설치｜裝遠端 App"]
    tactics: ["메신저피싱｜通訊軟體詐騙"]
  bank_card_alert:
    sources: [S1, S2]
    phrases:
      - "!안녕하세요. ○○년생 △△△씨 맞으시죠? ◇◇카드 배송 차 연락드렸는데요.｜您好，是某年生的某某吧？我是要配送某某卡而聯絡您。"
      - "!카드 신청한 적 없으시다고요? 요즘 명의도용 피해가 많아요. ◇◇카드 대표번호 1788-0XXX로 전화하셔서 카드 발급을 취소하세요.｜您說沒申請過卡？最近冒名受害很多，請打某某卡代表號 1788-0XXX 取消。"
      - "!◇◇카드 사고예방팀입니다. 신청하지 않은 카드가 배송되었다면 개인정보 유출일 가능성이 높습니다.｜這裡是某某卡事故預防組，若配送了沒申請的卡，很可能個資外洩。"
      - "!금일 배송 중인 ◇◇카드와 연동된 ○○계좌가 정상개설 되신 것으로 확인되거든요?｜確認到今天配送中的卡所連動的某某帳戶已經正常開設了。"
      - "고객님 명의로 해외 결제가 시도됐습니다.｜有人以您名義嘗試海外付款。"
      - "보안승급이 필요합니다. 보안카드 번호를 불러주세요.｜需要安全升級，請唸出安全卡號碼。"
      - "텔레뱅킹 이체 비밀번호를 확인하겠습니다.｜我要確認電話銀行轉帳密碼。"
