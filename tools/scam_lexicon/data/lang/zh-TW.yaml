lang: zh-TW
name: 繁體中文
regions: ["台灣", "香港（粵語口語以 [HK] 標示）", "澳門"]
sources:
  S1: {title: "內政部警政署保安警察第一總隊：常見詐騙手法話術解析與預防策略（165 整理）", url: "https://www.1spc.npa.gov.tw/ch/app/faq/view?id=1879&module=faq&serno=8cba94a3-2062-490e-862f-01ed4e499ea6"}
  S2: {title: "法務部：解除分期付款詐騙手法及民眾該如何防範", url: "https://www.moj.gov.tw/2204/2473/2492/131009/"}
  S3: {title: "法務部澎湖地檢：常見詐騙案例犯罪手法及預防方式一覽表（含假 165 語音、+886 來電）", url: "https://www.phc.moj.gov.tw/media/173958/0927959273.pdf"}
  S4: {title: "防詐雷達（轉載 165 闢謠）：如何辨識假檢警詐騙電話（健保卡鎖卡／電信停話按 9）", url: "https://fraud.tw/alerts/77/"}
  S5: {title: "中央社：詐騙謊稱健保卡違規 刑事局公布 8 招破解術", url: "https://www.cna.com.tw/news/firstnews/201711050110.aspx"}
  S6: {title: "內政部警政署 165 全民防騙網", url: "https://165.npa.gov.tw/"}
  S7: {title: "香港警務處：冒充內地官員電話騙案特徵一文看清", url: "https://www.police.gov.hk/offbeat120/scam/04_hk-fake-mainland-official-guide.html"}
  S8: {title: "香港警務處《警聲》：虛構綁架、猜猜我是誰、假冒內地官員電話騙案", url: "https://www.police.gov.hk/offbeat/1045/chi/index.html"}
  S9: {title: "東網：冒內地官來電騙案飆升（速遞包裹涉洗黑錢→轉駁執法人員）", url: "https://hk.on.cc/hk/bkn/cnt/news/20150730/bkn-20150730222051767-0730_00822_001.html"}
  S10: {title: "香港反詐騙協調中心 ADCC／防騙視伏器", url: "https://www.adcc.gov.hk/zh-hk/home.html"}
  S11: {title: "ETtoday：「你兒子在我手上」索 60 萬 詐騙老梗", url: "https://www.ettoday.net/news/20171031/1042531.htm"}
  S12: {title: "趨勢科技打詐週報：AI 詐騙技術躍進，傳統驗證瀕臨失效", url: "https://blog.trendmicro.com.tw/?p=88888"}
  S13: {title: "監察院轉載 165：常見詐騙手法話術解析與預防策略", url: "https://www.cy.gov.tw/News_Content.aspx?n=138&s=27470"}
  S14: {title: "新北市板橋分局：假檢警詐騙手法老梗騙不膩 熟記詐騙關鍵字", url: "https://www.banqiao.police.ntpc.gov.tw/cp-88-16085-11.html"}
categories:
  police_prosecutor:
    sources: [S1, S3, S4, S14, S7, S8, S9]
    phrases:
      - "!這裡是刑事警察局，我們偵辦一件洗錢案，查到你的帳戶被當成人頭帳戶。"
      - "你的身分被歹徒冒用，在高雄開了一個帳戶，涉及一起詐騙案，被害人有十幾個人。"
      - "!本案偵查不公開，你不能告訴任何人，包括你的家人跟銀行行員。"
      - "我現在幫你做電話筆錄，請你找一個安靜沒有人的地方。"
      - "法院已經發出拘票，如果你不配合，我們明天就會去你家拘提。"
      - "你如果是清白的，就要配合我們把資金交給法院監管，證明這些錢不是贓款。"
      - "!請你把帳戶裡的錢轉到監管帳戶，等案子結束就會全額退還給你。"
      - "我是地檢署的檢察官，我姓陳，你可以上網查我們的案件查詢系統。"
      - "我現在用 LINE 傳公文給你看，上面有你的名字跟身分證字號。"
      - "!我們會傳真法院公文到你家附近的超商，你去收一下。"
      - "你加一下這個 LINE ID，我們用視訊幫你做筆錄，我給你看我的警察證。"
      - "電話不要掛斷，掛斷就視同拒絕配合調查，會直接列為被告。"
      - "等一下行員問你領錢做什麼，你就說是要買房子、要裝潢。"
      - "我們會派法院的專員去跟你收現金，他會出示證件跟收據。"
      - "你的財產要先做資金清查，請你把存款、定存、保單都解約領出來。"
      - "這個案子跟毒品洗錢有關，你如果不配合，帳戶會全部凍結。"
      - "為了保護你的資產，請你去買金條，我們會派人保管。"
      - "請你把提款卡跟密碼寄到我們指定的地址，作為證物。"
      - "現在要幫你申請羈押停止，需要繳一筆保證金。"
      - "你名下的手機門號被用來發詐騙簡訊，警方已經立案。"
      - "我們跟金管會合作，要清查你所有銀行的帳戶。"
      - "這通電話有錄音，請你回答『是』或『不是』就好。"
      - "你在接下來調查期間每兩個小時要跟我回報一次。"
      - "你要下載這個 App 讓我們監控資金流向，保護你的安全。"
      - "[HK] 我哋係內地公安，你嘅身份證被人盜用，涉及一宗洗黑錢案件。"
      - "[HK] 呢單案好嚴重，你唔配合就會被通緝，甚至遣返返內地。"
      - "[HK] 你要搵個靜啲嘅地方，同我哋視像錄口供，全程唔可以收線。"
      - "[HK] 你要將啲錢轉去指定帳戶作保證金，證明你清白。"
      - "[HK] 呢個係保密調查，唔可以話俾屋企人知。"
      - "[HK] 你入間酒店住低先，唔好同外面聯絡，等我哋調查完。"
      - "[HK] 我而家send個網址俾你，你上去睇吓你嘅拘捕令。"
      - "[HK] 銀行職員問你做咩，你就話係做生意用。"
    strong: [監管帳戶, 安全帳戶, 偵查不公開, 電話筆錄, 視訊筆錄, 拘票, 資金清查, 法院公文, 人頭帳戶, 洗錢案, 涉嫌洗錢, 保證金, 羈押, 拘提, 通緝, 證明清白, 法院專員, 內地公安, 洗黑錢, 拘捕令, 錄口供, 保密調查, 遣返, 案件查詢]
    keywords: [刑事警察局, 刑事局, 地檢署, 檢察官, 警察局, 偵查隊, 警員編號, 書記官, 法官, 涉案, 立案, 凍結, 配合調查, 被冒用, 傳真, 公文, 金條, 解約, 定存, 公安, 檢察院]
    hard: [監管帳戶, 安全帳戶, 資金清查, 電話筆錄, 視訊筆錄]
    requests: [轉帳到監管帳戶, 臨櫃提領現金交給專員, 交付提款卡與密碼, 購買金條, 定存保單解約, 加 LINE 視訊, 下載監控 App, 到超商收傳真, 入住旅館隔離, 每小時回報]
    tactics: [偵查不公開不能說, 不能掛電話, 不配合就拘提或凍結, 說出完整身分證字號取信, 假公文假網站, 教你騙行員, 一通電話轉接多個機關]
  health_insurance_card:
    sources: [S4, S5, S1]
    phrases:
      - "!您的健保卡使用異常，將予以鎖卡，如有疑問請按 9 轉接專人服務。"
      - "這裡是健保署，你的健保卡在台中某診所重複領藥，是你本人去的嗎？"
      - "有人用你的健保卡申請了醫療補助，金額八萬多，你有申請嗎？"
      - "如果不是你本人，可能是身分被冒用，我直接幫你轉接警察局報案。"
      - "你的健保卡今天下午就會停用，以後看病不能用。"
      - "我這邊幫你轉刑事局的偵查隊，請不要掛斷。"
      - "你在高雄的醫院有一筆住院紀錄，需要你確認。"
      - "健保局系統顯示你的卡被用來申請重大傷病補助。"
      - "您好，這裡是某某醫院掛號處，您的健保資料有異常。"
    strong: [健保卡異常, 健保卡鎖卡, 鎖卡, 健保卡停用, 重複領藥, 醫療補助, 按9轉接, 轉接警察局, 健保卡被盜用]
    keywords: [健保署, 健保局, 健保卡, 掛號處, 住院紀錄, 重大傷病]
    hard: [健保卡鎖卡, 轉接警察局]
    requests: [按 9 轉接, 確認身分證字號, 由醫療單位轉接警察]
    tactics: [語音系統開場, 以停卡製造恐慌, 主動幫你報案]
  telecom_number:
    sources: [S4, S3, S1]
    phrases:
      - "!您的電信費用未繳納，將予以停話，如有疑問請按 9 轉接專人服務。"
      - "!中華電信您好，您曾以行動電話撥打美國及新加坡，四萬三千七百二十六元尚未付款。"
      - "你名下有一支門號在台北申辦，被用來發送詐騙簡訊。"
      - "您的門號兩小時後將被停用，請按 1 了解詳情。"
      - "有人冒用你的身分證辦了三支門號，我們建議你馬上報警，我幫你轉接。"
      - "您的室內電話欠費已經三個月，今天會被斷話。"
      - "!165 反詐騙專線您好，我們偵查詐欺案件中，發現你的個人資料外洩遭冒用。"
      - "你的手機門號涉及詐騙案件，NCC 要求暫停你的號碼。"
    strong: [停話, 門號被冒用, 冒用辦門號, 兩小時後停用, 欠費停話, 詐騙簡訊]
    keywords: [中華電信, 電信公司, 門號, 申辦, 室內電話, NCC]
    requests: [按 9 或按 1 轉接, 轉接警察報案, 確認身分證]
    tactics: [假 165 語音（不掛線佔線冒充 165）, 停話恐嚇]
    notes: 歹徒會不掛斷市話佔線，讓你撥 165 時仍連到歹徒（S3）。
  installment_order_error:
    sources: [S1, S2, S13]
    phrases:
      - "!您好，我這邊是某某網路商店的客服，您前次的交易資料有誤，被設定成批發商，會重複扣款。"
      - "!因為系統出錯，您的訂單被誤設成分期付款，每個月會扣款十二期。"
      - "您上次訂的房間被設定成 VIP 會員，每個月會自動扣款。"
      - "我們已經通知您的銀行，等一下會有銀行客服打給您幫您解除。"
      - "這裡是某某銀行客服，商家通知我們您的帳戶被誤設定分期，要幫您解除設定。"
      - "請問您身上有提款卡嗎？附近有沒有 ATM？"
      - "請您到 ATM 前面再打給我，我一步一步教您操作。"
      - "請按『其他服務』，再按『轉帳』，輸入解除碼。"
      - "這組數字是您的解除代碼，請輸入在金額的地方。"
      - "您用網路銀行也可以，請登入後到約定轉帳，我們幫您驗證帳戶。"
      - "操作失敗了，系統沒有成功解除，我們要再做一次。"
      - "如果今天不解除，明天就會開始扣款，而且無法退款。"
      - "您也可以去超商買遊戲點數，把序號給我，我們用點數做身分驗證。"
      - "您的帳戶要先做一次反向驗證，確認不是人頭帳戶。"
      - "您好，這邊是演唱會票務客服，您的購票資料被重複下單了。"
      - "我們要幫您取消升級會員的設定，不然每個月扣三千元。"
      - "您訂購的商品因為工作人員疏失，變成十二筆訂單。"
      - "請不要掛斷，我現在幫您轉接銀行的金融監管人員。"
    strong: [解除分期, 誤設分期, 設定錯誤, 重複扣款, 批發商, 升級VIP, VIP會員, 解除設定, 系統出錯, 解除碼, 反向驗證, 十二期扣款, 重複下單, 到ATM前面操作解除]
    keywords: [網路商店, 客服, 訂單, 每個月扣款, 分期付款, 銀行客服, 提款卡, 網路銀行, 約定轉帳, 遊戲點數, 序號]
    hard: [解除分期, 解除設定, 解除碼, 到ATM前面操作解除]
    requests: [到 ATM 照指示操作, 網銀設定約定轉帳, 無卡存款, 購買遊戲點數唸序號, 提供帳戶餘額]
    tactics: [準確說出訂單明細取信, 客服→銀行接力, 今天不處理就扣款, 操作失敗要重來]
  bank_card_alert:
    sources: [S1, S6]
    phrases:
      - "這裡是某某銀行信用卡風險管控中心，您的卡片剛剛在國外有一筆三萬元的刷卡。"
      - "您的帳戶被駭客入侵，我們要幫您把資金移到安全的帳戶。"
      - "請提供卡片背面的三碼，我們幫您止付。"
      - "我們會傳一組簡訊驗證碼給您，請您唸給我確認是本人。"
      - "您的網銀帳號異常登入，請您告訴我您的使用者代號跟密碼來重設。"
      - "您的帳戶被列為警示帳戶，要先做身分驗證。"
      - "我們分行有內鬼在盜領客戶的錢，請您不要相信櫃台行員。"
      - "我們會派專員到府收回您的舊卡，請把卡片和密碼放在信封裡。"
      - "銀行公會通知，您的提款卡資料外洩，需要更換新卡。"
      - "請您打開銀行 App，看到通知時按『確認』就可以取消那筆交易。"
    strong: [移到安全帳戶, 警示帳戶, 資料外洩更換卡片, 派專員收卡, 信封裝卡片密碼, 不要相信行員, 異常登入]
    keywords: [風險管控中心, 信用卡中心, 盜刷, 止付, 背面三碼, 銀行公會, 網銀, 帳戶異常]
    requests: [唸驗證碼, 提供卡號與背面三碼, 在 App 按確認, 移轉存款, 交出卡片]
    tactics: [說出部分卡號與交易取信, 時間壓力, 離間你與分行]
    notes: 真的銀行防詐中心也會來電核對刷卡（bageo stall_review 有特別處理），關鍵差別在是否索取驗證碼、密碼或要求轉帳。
  otp_password:
    sources: [S1, S6]
    phrases:
      - "等一下會有一組六位數的簡訊驗證碼，麻煩您唸給我。"
      - "那組數字是系統要確認您本人，請您直接告訴我。"
      - "您手機收到的認證碼是多少？"
      - "我手機送修，借你的手機號碼收一下簡訊認證碼，收到告訴我。"
      - "請您把提款卡密碼按在電話鍵盤上，我們系統會加密。"
      - "請把身分證正反面拍給我，做實名認證。"
      - "您的 LINE 帳號要驗證，請把收到的驗證碼給我。"
      - "這組驗證碼不是轉帳用的，只是取消交易用的，放心。"
    strong: [唸驗證碼, 簡訊驗證碼, 認證碼給我, 驗證碼唸給我, 收簡訊認證碼, 密碼按在電話]
    keywords: [驗證碼, 認證碼, 六位數, 密碼, 實名認證, 身分證正反面]
    hard: [唸驗證碼, 驗證碼唸給我, 認證碼給我, 收簡訊認證碼]
    requests: [唸出 OTP, 輸入 PIN, 拍身分證]
    tactics: [說驗證碼只是取消用, 冒用親友帳號借收簡訊]
  parcel_customs:
    sources: [S7, S8, S9]
    phrases:
      - "你有一件包裹被海關扣留，裡面有十本護照和二十張銀行卡。"
      - "你寄往大陸的包裹裡面有毒品，現在已經被扣押了。"
      - "你如果沒寄過，那可能是身分被冒用，我幫你轉接公安局。"
      - "包裹需要補繳關稅才能放行，請轉帳到這個帳戶。"
      - "[HK] 你好，我哋係速遞公司，你有個包裹入面有違法物品，已經被扣留。"
      - "[HK] 你個包裹涉及洗黑錢活動，我幫你轉駁去內地公安。"
      - "[HK] 你有件速遞要從速認領，唔係就會退回同埋報警處理。"
      - "郵局通知，你有一件掛號包裹無法投遞，請按 9 查詢。"
    strong: [包裹被扣留, 包裹有違禁品, 海關扣押, 補繳關稅, 轉接公安局, 轉駁內地公安, 包裹涉及洗黑錢]
    keywords: [包裹, 海關, 快遞, 速遞, 護照, 銀行卡, 毒品, 掛號包裹]
    hard: [轉接公安局, 轉駁內地公安]
    requests: [付關稅, 轉接執法機關, 提供個資]
    tactics: [快遞→公安接力, 違禁品恐嚇]
  guess_who:
    sources: [S1, S8, S13]
    phrases:
      - "!猜猜我是誰？"
      - "你聽不出來我是誰喔？很久沒聯絡了。"
