lang: zh-CN
name: 简体中文
regions: ["中国大陆", "新加坡／马来西亚华语（部分）"]
sources:
  S1: {title: "公安部刑侦局、国家反诈中心《2025版防范电信网络诈骗宣传手册》（中国政府网）", url: "https://www.gov.cn/lianbo/bumen/202506/content_7028568.htm"}
  S2: {title: "公安部公布十大高发电信网络诈骗类型（长江县公安局转载）", url: "https://www.cj.gov.cn/p117/bmyw/20240626/266740.html"}
  S3: {title: "国家反诈中心公布十大高发诈骗类型（澎湃新闻政务号）", url: "https://www.thepaper.cn/newsDetail_forward_13809946"}
  S4: {title: "中国互联网协会：2026 国家网络安全宣传周 10 种电信网络诈骗套路揭秘", url: "https://www.isc.org.cn/article/30393721096892416.html"}
  S5: {title: "十堰市教育局：致全市师生及家长防范电信网络诈骗的一封信（十类高发手法）", url: "http://jyj.shiyan.gov.cn/jyjxxgk/sfgwgkml/xyaq/202505/t20250513_4738666.shtml"}
  S6: {title: "福建省公安厅：假客服，真诈骗！受害人现身说法", url: "https://gat.fujian.gov.cn/ztzl/fjjffpzxrx/spjq/202305/t20230522_6173250.htm"}
  S7: {title: "无锡市公安局：警惕“注销京东白条”新型骗局", url: "https://ga.wuxi.gov.cn/doc/2023/01/30/3871815.shtml"}
  S8: {title: "香港警务处：冒充内地官员电话骗案特征（对象含内地来港人士）", url: "https://www.police.gov.hk/offbeat120/scam/04_hk-fake-mainland-official-guide.html"}
  S9: {title: "新加坡 ScamShield（政府防诈平台）", url: "https://www.scamshield.gov.sg/"}
categories:
  police_prosecutor:
    sources: [S1, S2, S3, S4, S8]
    phrases:
      - "!你好，我是某某市公安局刑侦支队的民警，你的银行卡涉嫌洗钱犯罪，需要你配合调查。"
      - "你名下有一张银行卡被用于跨境洗钱，涉案金额三百多万。"
      - "这是保密案件，不能告诉任何人，包括你的家人，否则就是泄露案情。"
      - "我现在给你看逮捕证和通缉令，上面有你的照片和身份证号。"
      - "你下载一个会议软件，打开屏幕共享，我们核查一下你卡里的资金。"
      - "!你需要把银行卡内资金转移到指定的安全账户，才能证明清白。"
      - "为了证明资金流水正常，你还要通过银行贷款，一并转进安全账户。"
      - "你现在找一个宾馆住下，不要和外界联系，等我们通知。"
      - "法院要马上冻结你的银行账户，我可以帮你找法官讲情，少冻结一段时间。"
      - "把银行账号、密码和手机验证码告诉我，我们做资金核查。"
      - "!聊天记录、短信、通话记录全部删掉，这是办案需要。"
      - "我是检察院的检察官，你的案件已经移交到我这边。"
      - "你涉嫌非法出入境、快递藏毒，护照有问题。"
      - "我们加个微信，视频做笔录，我给你看我的警官证。"
      - "你要配合资金清查，清查完毕会原路退回。"
      - "你如果不配合，我们会立即对你实施拘留。"
      - "这个账户是国家安全账户，受公安部监管，非常安全。"
      - "银行柜员问你，就说是给家里人买房用的。"
      - "我们会给你一个手机，你用这个手机跟我们联系。"
      - "你现在去开一个新的银行卡，绑定我们给你的号码。"
      - "（新加坡）This is MAS officer... 你好，我是新加坡金融管理局的官员，你的账户涉及洗钱调查。"
    strong: [安全账户, 涉嫌洗钱, 资金核查, 资金清查, 配合调查, 保密案件, 逮捕证, 通缉令, 屏幕共享, 证明清白, 冻结你的银行账户, 宾馆住下, 视频做笔录, 警官证, 清查完毕原路退回, 国家安全账户, 快递藏毒]
    keywords: [公安局, 刑侦支队, 民警, 检察院, 检察官, 法院, 拘留, 跨境洗钱, 涉案金额, 非法出入境, 护照有问题, 金融管理局]
    hard: [安全账户, 资金核查, 资金清查, 国家安全账户]
    requests: [转入安全账户, 下载会议软件屏幕共享, 告知账号密码与验证码, 删除聊天记录, 入住宾馆隔离, 贷款后一并转账, 办新卡]
    tactics: [保密办案, 伪造法律文书, 隔离受害人, 拘留威胁, 教唆对柜员撒谎]
  ecommerce_refund:
    sources: [S1, S2, S4, S6]
    phrases:
      - "你好，我是某宝客服，你购买的商品检测出质量问题，我们要给你双倍理赔。"
      - "你的快递在运输途中丢失了，我们给你三倍赔偿。"
      - "理赔需要你下载一个软件，打开屏幕共享，我教你操作。"
      - "你的账户信用分不足，理赔款打不进来，需要先刷一下流水。"
      - "系统显示你的支付宝被冻结了，需要先转一笔钱解冻。"
      - "请把收到的验证码告诉我，我帮你办理退款。"
      - "你在我们平台开通了百万保障服务，不关闭的话每个月扣费。"
      - "你乘坐的航班因为机械故障取消了，我们给你办理改签，并补偿三百元。"
      - "改签需要先验证你的银行卡流水，请登录网银。"
      - "你在某某借款 App 申请一下额度，证明你有还款能力，才能退款。"
      - "!加一下我的微信，我们一对一给你处理售后。"
      - "你扫一下这个二维码，就能领取退款。"
      - "你的会员自动续费了，要取消的话需要我们后台操作。"
      - "你买的产品涉嫌违规，要给你做退货退款。"
    strong: [双倍理赔, 三倍赔偿, 快递丢失理赔, 刷流水, 解冻, 百万保障, 航班取消改签, 退改签, 信用分不足, 理赔失败, 扫码退款, 关闭百万保障]
    keywords: [客服, 理赔, 退款, 售后, 质量问题, 快递丢失, 会员自动续费, 改签补偿, 借款App]
    requests: [下载软件屏幕共享, 告知验证码, 网贷借款, 扫码, 加微信]
    tactics: [精准说出订单信息, 主动退款, 冻结恐吓]
  credit_record:
    sources: [S2, S3, S5, S7]
    phrases:
      - "!你好，我是支付宝客服，你在大学期间以学生身份开通的花呗服务不合规，会影响征信。"
      - "!你之前申请的校园贷账号没有注销，需要帮你注销，不然影响个人征信。"
      - "你开通的京东金条额度需要清零，否则影响你以后贷款买房。"
      - "现在国家政策要求清理学生贷款记录，你必须配合注销。"
      - "你按照我说的操作，系统就会统一升级，贷款记录就会注销。"
      - "你需要在这几个平台上把额度借出来，转到我们的监管账户核销。"
      - "注销完毕后钱会原路返回到你的账户。"
      - "可能是你的朋友或学校的人帮你办理的，所以你没印象。"
      - "你的白条存在不良记录，我们帮你消除记录。"
    strong: [注销校园贷, 影响征信, 校园贷, 消除不良记录, 额度清零, 注销白条, 注销金条, 清空额度, 核销]
    keywords: [征信, 花呗, 借呗, 白条, 金条, 助学贷, 个人征信, 不良记录]
    hard: [注销校园贷]
    requests: [在网贷平台借款再转账, 开屏幕共享, 告知验证码]
    tactics: [精准个人信息, 征信恐吓, 政策包装]
  loan_advance_fee:
    sources: [S2, S3, S4]
    phrases:
      - "!无抵押、免征信、快速放贷，最快十分钟到账。"
      - "你的贷款已经审批通过了，但银行卡号填错了，资金被冻结，要交解冻费。"
      - "放款前要交一笔保证金，验证你的还款能力。"
      - "你的流水不够，需要刷流水验资，把银行卡寄给我们。"
      - "你下载我们的贷款 App，注册后就能提现。"
      - "要交会员费才能开通快速通道。"
    strong: [免征信, 无抵押, 解冻费, 保证金, 刷流水验资, 寄银行卡, 快速放贷, 会员费]
    keywords: [低息贷款, 秒到账, 审批通过, 银行卡号填错, 贷款App, 代办费, 手续费]
    hard: [刷流水验资, 寄银行卡]
    requests: [交解冻费, 交保证金, 寄出银行卡, 下载 App]
    tactics: [低门槛, 连续收费]
  job_mule:
    sources: [S2, S3, S4, S5]
    phrases:
      - "在家兼职，点赞关注就有佣金，日结。"
      - "!充值越多，返利越多。"
      - "你现在做的是组合单，必须完成四单才能提现。"
      - "你操作失误，账号被冻结了，要再充值才能解冻。"
      - "这一单是连单，要追加垫付。"
      - "帮我们走一下账，你的卡收到钱再转出去，给你提成。"
      - "出租你的银行卡，一个月给你五千。"
      - "下载这个 App 领红包，进高级群收益更高。"
    strong: [刷单, 连单, 卡单, 组合单, 充值越多返利越多, 垫付, 走账, 出租银行卡, 跑分, 日结佣金]
    keywords: [兼职, 点赞, 关注, 佣金, 返利, 提现, 高级群, 红包]
    hard: [走账, 出租银行卡, 跑分]
    requests: [垫付充值, 出借银行卡, 代收代转]
    tactics: [小额返利, 卡单追加]
  investment_crypto:
    sources: [S2, S4, S5]
    phrases:
      - "我们有内幕消息，掌握平台漏洞，回报丰厚。"
      - "老师今晚直播，免费教大家选股。"
      - "加入我们的内部投资群，跟着导师操作。"
      - "这个平台稳赚不赔，保本高收益。"
      - "你要提现，先缴纳个人所得税和保证金。"
      - "流水不足，不能出金。"
      - "虚拟货币现在是风口，USDT 稳定币投资月收益百分之二十。"
    strong: [内幕消息, 稳赚不赔, 保本高收益, 带单, 导师, 内部群, 提现先缴税, 流水不足, 平台漏洞]
    keywords: [荐股, 直播课, 投资群, 虚拟货币, USDT, 理财, 收益]
    hard: [稳赚不赔]
    requests: [下载投资 App, 充值, 缴税费]
    tactics: [先小赚后大骗, 专家包装]
  boss_acquaintance:
    sources: [S2, S4]
    phrases:
      - "小王，明天来我办公室一趟。（冒充领导）"
      - "我在开会，不方便接电话，你先帮我转一笔款给这个账户。"
      - "我已经把钱转到你的卡上了，你看一下截图，帮我转给对方。"
      - "这是我朋友，项目急需用钱，你先垫上。"
      - "我是你孩子的班主任，需要交资料费。"
    strong: [明天来我办公室, 不方便接电话先转款, 帮我转给对方, 先垫上]
    keywords: [领导, 老板, 班主任, 资料费, 项目急需]
    requests: [代转账, 垫付]
    tactics: [权威, 假截图, 时间紧迫]
  family_emergency:
    sources: [S2, S4]
    phrases:
      - "妈，我在外地出事了，被派出所扣了，需要交钱。"
      - "我是你儿子的朋友，他出车祸了在医院抢救，急需手术费。"
      - "你孙子打架把人打伤了，要赔对方医药费，不然要坐牢。"
      - "这事别告诉我爸，你先转钱给我同学。"
    strong: [派出所扣了, 急需手术费, 不然要坐牢, 别告诉我爸]
    keywords: [出事了, 车祸, 抢救, 医药费, 打伤]
    requests: [立即转账]
    tactics: [紧急, 保密]
  guess_who:
    sources: [S2]
    phrases:
      - "猜猜我是谁？"
      - "听不出我的声音了？我是你老同学啊。"
      - "我换号了，你存一下这个新号。"
      - "我手机卡销户了，其他软件都登录不了。"
    strong: [猜猜我是谁, 我换号了, 手机卡销户了]
    keywords: [老同学, 新号, 听不出]
    requests: [存新号码, 转账]
    tactics: [让你自己说出身份]
  ai_voice_clone:
    sources: [S4]
    phrases:
      - "（AI 拟声）妈，是我，快给我转点钱。"
      - "我现在视频不方便，你听声音就知道是我。"
      - "（AI 换脸视频）老板：这笔款今天必须付给合作方。"
    strong: [视频不方便, 听声音就知道是我]
    keywords: [AI换脸, AI拟声]
    requests: [紧急转账]
    tactics: [伪造熟人语音视频]
  telecom_number:
    sources: [S3]
    phrases:
      - "!你好，我是电信公司工作人员，你是不是用身份证在上海办理了电话卡？"
      - "有人冒充你办理了电话卡，用来发送诈骗短信，我已经帮你报了警。"
      - "你的手机号涉嫌违规，两小时后将被停机，详情请按 1。"
      - "工信部通知，你的号码存在异常，需要配合核实。"
    strong: [冒充你办理了电话卡, 帮你报了警, 两小时后停机, 号码涉嫌违规]
    keywords: [电信公司, 移动公司, 联通, 工信部, 电话卡, 停机]
    requests: [转接民警, 按键]
    tactics: [运营商→公安接力]
  health_insurance_card:
    sources: [S1]
    phrases:
      - "你好，这里是医保局，你的医保卡在外地被盗刷了。"
      - "你的社保卡存在违规套现，需要冻结。"
      - "我帮你转接当地公安报案。"
    strong: [医保卡被盗刷, 社保卡违规套现, 转接公安报案]
    keywords: [医保局, 医保卡, 社保卡, 社保局]
    hard: [转接公安报案]
    requests: [转接公安]
    tactics: [冒充医保后转公检法]
  parcel_customs:
    sources: [S2, S8]
    phrases:
      - "你有一个国际快递被海关查扣，里面有违禁品。"
      - "你寄出的快递里面夹带了护照和银行卡，涉嫌违法。"
      - "我是快递员，你的快递丢了，加我微信给你理赔。"
    strong: [海关查扣, 快递夹带违禁品, 快递丢了加微信理赔]
    keywords: [国际快递, 海关, 违禁品, 快递员]
    requests: [转接公安, 加微信]
    tactics: [快递→公检法]
  otp_password:
    sources: [S3, S4]
    phrases:
      - "!把手机验证码告诉我。"
      - "系统给你发了一个验证码，你念一下给我核对。"
      - "请你把银行卡密码输入一下，我们这边加密处理。"
    strong: [验证码告诉我, 验证码念一下, 输入银行卡密码]
    keywords: [验证码, 密码, 动态码]
    hard: [验证码告诉我, 验证码念一下]
    requests: [告知验证码]
    tactics: [以核对为名]
  gift_card_payment:
    sources: [S4]
    phrases:
      - "你去买游戏点卡，把卡密发给我。"
      - "用京东 E 卡支付就可以。"
    strong: [卡密发给我, 游戏点卡, 京东E卡]
    keywords: [点卡, 卡密, 充值卡]
    hard: [卡密发给我]
    requests: [购买点卡发卡密]
    tactics: [以缴费为名]
  gov_subsidy:
    sources: [S1]
    phrases:
      - "你好，这里是社保中心，你可以领取一笔失业补贴，需要核实银行卡。"
      - "你有一笔个税退税，点链接填写银行卡信息。"
      - "教育部门发放助学金，需要先交手续费。"
    strong: [领取补贴核实银行卡, 个税退税, 助学金先交手续费]
    keywords: [社保中心, 补贴, 退税, 助学金, 手续费]
    requests: [提供银行卡, 交手续费]
    tactics: [好处诱惑]
  romance:
    sources: [S2]
    phrases:
      - "宝贝，我发现一个平台有漏洞，我们一起投资赚钱结婚。"
      - "我舅舅在这个平台做分析师，内部消息很准。"
      - "你充值试一下，赚了钱我们一起买房。"
    strong: [平台有漏洞, 一起投资结婚]
    keywords: [宝贝, 杀猪盘, 婚恋]
    requests: [充值]
    tactics: [情感+投资]
  prize_lottery:
    sources: [S2]
    phrases:
      - "恭喜你被抽中幸运观众，奖品是一辆汽车。"
      - "领奖需要先交个人所得税和公证费。"
    strong: [幸运观众, 领奖先交税]
    keywords: [中奖, 公证费, 奖品]
    requests: [先交费]
    tactics: [意外之喜]
  marketplace_escrow:
    phrases:
      - "买家说下不了单，要你点保证金认证链接做卖家实名认证。"
